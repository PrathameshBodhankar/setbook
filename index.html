<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setbook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2340B8">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFE; --rule:#DCE4F0; --margin:#E4574B; --ink:#2340B8; --text:#1C2230;
  --pencil:#5F6878; --hi:#FFF07A; --line:#C3CEE0; --danger:#B9332A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161B26; --rule:#222A3A; --margin:#D9635A; --ink:#A3B6FF; --text:#E7EAF1;
  --pencil:#9AA3B4; --hi:rgba(255,226,80,.22); --line:#34405A; --danger:#FF8378; color-scheme:dark;
}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  color:var(--text); font:17px/28px "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
}
body::after{ /* the notebook margin line */
  content:""; position:fixed; top:0; bottom:0; width:2px; background:var(--margin); opacity:.65;
  left:calc(max(0px, 50% - 340px) + 40px); pointer-events:none;
}
.wrap{max-width:680px; margin:0 auto; padding:14px 20px 120px 60px}
h1,h2,h3{font-family:Kalam,"Comic Sans MS","Bradley Hand",cursive; color:var(--ink); margin:0}
h1{font-size:34px; line-height:56px}
h2{font-size:26px; line-height:56px; margin-top:14px}
h3{font-size:21px; line-height:28px}
.top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
#greet,.note,.meta,.prev,figcaption{color:var(--pencil)}
.note{margin:0 0 14px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.row.end{justify-content:flex-end; margin-top:28px}
.row.backup{justify-content:flex-start; margin:0 0 28px}
.btn{
  font:inherit; font-weight:700; color:var(--ink); background:transparent; cursor:pointer;
  border:2px solid var(--ink); border-radius:10px; min-height:44px; padding:0 18px;
}
.btn.primary{background:var(--ink); color:var(--paper)}
.btn.big{width:100%; min-height:56px; font-size:19px; margin:14px 0}
.btn.ghost{border-color:transparent; padding:0 8px}
.btn.small{min-height:36px; font-size:15px}
.btn.danger{color:var(--danger)} .btn.danger:not(.ghost){border-color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
input,select{
  font:inherit; color:var(--text); background:transparent; border:0; border-bottom:2px solid var(--line);
  border-radius:0; min-height:40px; width:100%; padding:0 4px;
}
input:focus{border-bottom-color:var(--ink)}
select{background:var(--paper)}
.form{display:grid; gap:14px; max-width:420px}
.form label{display:grid; font-weight:700}
.form .btn{justify-self:start; margin-top:14px}
.title{font-family:Kalam,cursive; font-size:26px; color:var(--ink); flex:1; min-width:180px; border-bottom-color:transparent}
.ex{margin:28px 0}
.sets{margin:6px 0}
.sh,.set{display:grid; grid-template-columns:30px 1fr 72px 64px 44px; gap:8px; align-items:center}
.sh{font-size:14px; color:var(--pencil); font-weight:700}
.set{min-height:48px; border-radius:6px; padding:0 4px; margin:0 -4px}
.set input{text-align:center; font-variant-numeric:tabular-nums}
.set.done{background:linear-gradient(100deg,transparent 0 2%,var(--hi) 3% 97%,transparent 98%)}
.prev{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chk{
  width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:transparent;
  color:transparent; font-size:20px; font-weight:700; cursor:pointer;
}
.chk[aria-pressed="true"]{border-color:var(--ink); color:var(--ink)}
.entry{border-bottom:1px solid var(--line); padding:6px 0}
.entry summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:0 12px; align-items:baseline}
.entry ul{margin:6px 0 10px; padding-left:20px}
.meta{font-size:15px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:6px 0 14px}
.stats b{display:block; font-family:Kalam,cursive; font-size:28px; line-height:42px; color:var(--ink)}
.stats span{font-size:15px; color:var(--pencil)}
.chart{margin:0}
.chart svg{width:100%; height:auto; display:block}
.bar{fill:var(--ink); opacity:.35} .bar.now{opacity:1}
.lbl{font-size:10px; fill:var(--pencil)} .cnt{font-size:11px; font-weight:700; fill:var(--ink)}
figcaption{font-size:14px; line-height:22px; margin-top:6px}
.tabs{
  position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
  background:var(--paper); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs button{
  flex:1; max-width:170px; font:inherit; font-weight:700; color:var(--pencil); background:none; border:0;
  min-height:58px; cursor:pointer; border-top:3px solid transparent;
}
.tabs button[aria-current="page"]{color:var(--ink); border-top-color:var(--ink)}
dialog{
  width:min(560px, calc(100vw - 24px)); max-height:82vh; padding:14px 20px 20px; color:var(--text);
  background:var(--paper); border:2px solid var(--ink); border-radius:14px;
}
dialog::backdrop{background:rgba(10,15,30,.45)}
.ph{display:flex; justify-content:space-between; align-items:center}
#q{margin:4px 0 10px}
#list h3{margin-top:14px}
.pick{
  display:block; width:100%; text-align:left; font:inherit; color:var(--text); background:none;
  border:0; border-bottom:1px solid var(--rule); min-height:44px; cursor:pointer; padding:0 4px;
}
.pick:hover:not(:disabled){color:var(--ink)}
.pick:disabled{color:var(--pencil); cursor:default}
.mine{display:flex; align-items:center; gap:8px} .mine .pick{flex:1}
.addown{margin-top:14px}
#toast{
  position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--text); color:var(--paper); padding:8px 16px; border-radius:10px; font-weight:700;
  opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center;
}
#toast.show{opacity:1}
@media (max-width:480px){
  body::after{left:24px}
  .wrap{padding-left:38px; padding-right:14px}
  .sh,.set{grid-template-columns:24px 1fr 62px 54px 42px; gap:6px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Setbook</h1><span id="greet"></span></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="workout">Workout</button>
  <button data-tab="history">History</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="profile">Profile</button>
</nav>
<dialog id="picker" aria-labelledby="pickTitle">
  <div class="ph"><h2 id="pickTitle">Add exercise</h2><button class="btn ghost small" id="closePick">Close</button></div>
  <input id="q" type="search" placeholder="Search or add an exercise" aria-label="Search exercises">
  <div id="list"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const EX = [
  ["Bench Press","Chest"],["Incline Bench Press","Chest"],["Incline Dumbbell Press","Chest"],["Dumbbell Bench Press","Chest"],
  ["Chest Fly","Chest"],["Cable Crossover","Chest"],["Push-up","Chest"],
  ["Overhead Press","Shoulders"],["Dumbbell Shoulder Press","Shoulders"],["Arnold Press","Shoulders"],["Lateral Raise","Shoulders"],
  ["Front Raise","Shoulders"],["Rear Delt Fly","Shoulders"],["Face Pull","Shoulders"],["Shrug","Shoulders"],
  ["Pull-up","Back"],["Chin-up","Back"],["Lat Pulldown","Back"],["Barbell Row","Back"],["Seated Cable Row","Back"],
  ["Dumbbell Row","Back"],["T-Bar Row","Back"],["Deadlift","Back"],["Back Extension","Back"],
  ["Back Squat","Legs"],["Front Squat","Legs"],["Goblet Squat","Legs"],["Leg Press","Legs"],["Hack Squat","Legs"],
  ["Romanian Deadlift","Legs"],["Lunge","Legs"],["Walking Lunge","Legs"],["Bulgarian Split Squat","Legs"],["Step-up","Legs"],
  ["Leg Curl","Legs"],["Leg Extension","Legs"],["Calf Raise","Legs"],["Hip Thrust","Legs"],["Glute Bridge","Legs"],
  ["Bicep Curl","Arms"],["Hammer Curl","Arms"],["Preacher Curl","Arms"],["Tricep Pushdown","Arms"],["Overhead Tricep Extension","Arms"],
  ["Skull Crusher","Arms"],["Close-Grip Bench Press","Arms"],["Dip","Arms"],
  ["Plank","Core"],["Side Plank","Core"],["Crunch","Core"],["Hanging Leg Raise","Core"],["Russian Twist","Core"],
  ["Cable Crunch","Core"],["Ab Wheel Rollout","Core"],["Mountain Climber","Core"],["Dead Bug","Core"],
  ["The Hundred","Pilates"],["Roll Up","Pilates"],["Single Leg Circles","Pilates"],["Rolling Like a Ball","Pilates"],
  ["Single Leg Stretch","Pilates"],["Double Leg Stretch","Pilates"],["Criss-Cross","Pilates"],["Spine Stretch Forward","Pilates"],
  ["Saw","Pilates"],["Swan","Pilates"],["Swimming","Pilates"],["Teaser","Pilates"],["Side Kick Series","Pilates"],
  ["Shoulder Bridge","Pilates"],["Leg Pull Front","Pilates"],["Pilates Plank","Pilates"]
];
const MUSCLES = ["Chest","Shoulders","Back","Legs","Arms","Core","Pilates"];
const TIMED = new Set(["Plank","Side Plank","Swimming","Leg Pull Front","Pilates Plank"]);
const isTime = n => TIMED.has(n) || !!(state.custom||[]).find(c=>c.name===n && c.timed);

/* ---------- storage: localStorage with in-memory fallback ---------- */
const KEY = "setbook:v1";
let memCopy = null;
function load(){
  let d = null;
  try { const s = localStorage.getItem(KEY); if (s) d = JSON.parse(s); } catch(e){}
  d = d || memCopy || {profile:null, history:[], active:null};
  d.custom = cleanCustom(d.custom);
  return d;
}
function cleanCustom(list){
  if (!Array.isArray(list)) return [];
  const seen = new Set();
  return list.filter(c => c && typeof c.name==="string" && c.name.trim() && !seen.has(c.name.trim().toLowerCase()) && seen.add(c.name.trim().toLowerCase()))
             .map(c => ({name:c.name.trim().slice(0,40), timed:!!c.timed}));
}
function save(){
  memCopy = state;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

let state = load();
let tab = "workout";
const $ = s => document.querySelector(s);
const view = $("#view");

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const shortDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const vol = w => w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+((s.done!==false)?(+s.w||0)*(+s.r||0):0),0),0);
const fmtKg = n => Math.round(n).toLocaleString()+" kg";
function lastFor(name){
  for (const w of state.history){ const e = w.exercises.find(x=>x.name===name); if (e && e.sets.length) return e.sets; }
  return null;
}
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function weekStats(back){
  const s = weekStart(Date.now()); s.setDate(s.getDate()-7*back);
  const e = new Date(s); e.setDate(e.getDate()+7);
  const ws = state.history.filter(w=>w.start>=s.getTime() && w.start<e.getTime());
  return {start:s.getTime(), count:ws.length, vol:ws.reduce((a,w)=>a+vol(w),0),
          sets:ws.reduce((a,w)=>a+w.exercises.reduce((b,x)=>b+x.sets.length,0),0)};
}
let toastTimer;
function flash(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- views ---------- */
function profileForm(first){
  const p = state.profile || {name:"",weight:"",height:"",goal:"Build strength"};
  return `<h2>${first?"Set up your profile":"Profile"}</h2>
  ${first?'<p class="note">Everything stays on this device. Nothing is uploaded.</p>':""}
  <form id="pf" class="form" data-first="${first?1:0}">
    <label>Name<input name="name" required maxlength="40" value="${esc(p.name)}" autocomplete="given-name"></label>
    <label>Bodyweight (kg)<input name="weight" type="number" inputmode="decimal" step="0.1" min="0" value="${esc(p.weight)}"></label>
    <label>Height (cm)<input name="height" type="number" inputmode="numeric" min="0" value="${esc(p.height)}"></label>
    <label>Main goal<select name="goal">${["Build strength","Build muscle","Lose fat","Stay active"].map(g=>`<option ${g===p.goal?"selected":""}>${g}</option>`).join("")}</select></label>
    <button class="btn primary" type="submit">${first?"Create profile":"Save profile"}</button>
  </form>
  ${first?"":`<h2>Your data</h2>
  <p class="note">${state.history.length} workout${state.history.length===1?"":"s"} saved in this browser. Clearing your browser data erases them.</p>
  <p class="note">Export a backup now and then. You can import it here or on another device.</p>
  <div class="row backup"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button></div>
  <button class="btn danger" data-act="wipe">Delete all data</button>`}`;
}

function entry(w, canDelete){
  return `<details class="entry"><summary><strong>${esc(w.name)}</strong>
    <span class="meta">${fmtDate(w.start)}, ${fmtKg(vol(w))}</span></summary>
    <ul>${w.exercises.map(e=>`<li><b>${esc(e.name)}</b> ${e.sets.map(s=>(s.w?s.w+"×":"")+s.r+(isTime(e.name)?"s":"")).join(", ")}</li>`).join("")}</ul>
    ${canDelete?`<button class="btn ghost small danger" data-act="del" data-id="${esc(w.id)}">Delete workout</button>`:""}
  </details>`;
}

function exBlock(e,i){
  const prev = lastFor(e.name), t = isTime(e.name);
  return `<section class="ex">
    <div class="row"><h3>${esc(e.name)}</h3><button class="btn ghost small" data-act="rmex" data-i="${i}" aria-label="Remove ${esc(e.name)}">Remove</button></div>
    <div class="sets">
      <div class="sh"><span>Set</span><span>Previous</span><span>kg</span><span>${t?"sec":"reps"}</span><span></span></div>
      ${e.sets.map((s,j)=>{ const p = prev && prev[j]; return `<div class="set ${s.done?"done":""}">
        <span>${j+1}</span>
        <span class="prev">${p?(p.w?p.w+" × ":"")+p.r:"–"}</span>
        <input type="number" inputmode="decimal" step="0.5" min="0" data-f="w" data-i="${i}" data-j="${j}" value="${esc(s.w)}" placeholder="${p?esc(p.w):""}" aria-label="Set ${j+1} weight in kg">
        <input type="number" inputmode="numeric" min="0" data-f="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" placeholder="${p?esc(p.r):""}" aria-label="Set ${j+1} ${t?"seconds":"reps"}">
        <button class="chk" data-act="done" data-i="${i}" data-j="${j}" aria-pressed="${!!s.done}" aria-label="Mark set ${j+1} done">✓</button>
      </div>`; }).join("")}
    </div>
    <button class="btn ghost small" data-act="addset" data-i="${i}">Add set</button>
  </section>`;
}

function workoutView(){
  const a = state.active;
  if (!a){
    const last = state.history[0], wk = weekStats(0);
    return `<h2>Today</h2>
    <button class="btn primary big" data-act="start">Start workout</button>
    <p class="note">${wk.count} workout${wk.count===1?"":"s"} this week${wk.count?", "+fmtKg(wk.vol)+" lifted":""}.</p>
    ${last?`<h2>Last time</h2>${entry(last,false)}`:'<p class="note">Your first workout shows up here once you finish it.</p>'}`;
  }
  return `<div class="row"><input class="title" data-f="name" value="${esc(a.name)}" aria-label="Workout name"></div>
    ${a.exercises.map(exBlock).join("") || '<p class="note">Add your first exercise to start logging sets.</p>'}
    <button class="btn" data-act="pick">Add exercise</button>
    <div class="row end"><button class="btn ghost danger" data-act="discard">Discard</button><button class="btn primary" data-act="finish">Finish workout</button></div>`;
}

function historyView(){
  if (!state.history.length) return `<h2>History</h2><p class="note">No workouts yet. Finish one and it lands here.</p>`;
  return `<h2>History</h2>` + state.history.map(w=>entry(w,true)).join("");
}

function progressView(){
  const weeks = [...Array(8)].map((_,i)=>weekStats(7-i));
  const max = Math.max(1, ...weeks.map(w=>w.vol));
  const cur = weeks[7], prev = weeks[6];
  const diff = prev.vol ? Math.round((cur.vol-prev.vol)/prev.vol*100) : null;
  const W=320, H=180, bw=24, slot=W/8;
  const bars = weeks.map((w,i)=>{
    const h = Math.round(w.vol/max*(H-54)), x = i*slot+(slot-bw)/2, y = H-24-h;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${w.vol?Math.max(h,2):0}" rx="3" class="bar${i===7?" now":""}">
      <title>Week of ${shortDate(w.start)}: ${fmtKg(w.vol)}, ${w.count} workouts</title></rect>
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="lbl">${shortDate(w.start)}</text>
      ${w.count?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="cnt">${w.count}</text>`:""}</g>`;
  }).join("");
  return `<h2>This week</h2>
  <div class="stats"><div><b>${cur.count}</b><span>workout${cur.count===1?"":"s"}</span></div><div><b>${fmtKg(cur.vol)}</b><span>volume</span></div><div><b>${cur.sets}</b><span>sets</span></div></div>
  <p class="note">${diff===null?"Log workouts two weeks in a row to see how your volume changes.":`${diff>=0?"Up":"Down"} ${Math.abs(diff)}% on last week’s volume.`}</p>
  <h2>Last 8 weeks</h2>
  <figure class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly training volume, last 8 weeks">${bars}</svg>
  <figcaption>Bars show total kg lifted (weight × reps) each week, starting Monday. The number above a bar is how many workouts you did.</figcaption></figure>`;
}

function render(){
  $("#tabs").hidden = !state.profile;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  $("#greet").textContent = state.profile ? "Hi, "+state.profile.name : "";
  if (!state.profile){ view.innerHTML = profileForm(true); return; }
  view.innerHTML = ({workout:workoutView, history:historyView, progress:progressView, profile:()=>profileForm(false)})[tab]();
}

/* ---------- events ---------- */
view.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const {act, id} = b.dataset, i = +b.dataset.i, j = +b.dataset.j, a = state.active;
  switch (act){
    case "start":
      state.active = {id:Date.now().toString(36), name:new Date().toLocaleDateString(undefined,{weekday:"long"})+" workout", start:Date.now(), exercises:[]};
      break;
    case "pick": openPicker(); return;
    case "rmex": a.exercises.splice(i,1); break;
    case "addset": { const ex=a.exercises[i], l=ex.sets[ex.sets.length-1]; ex.sets.push({w:l?l.w:"", r:l?l.r:"", done:false}); break; }
    case "done": {
      const ex=a.exercises[i], s=ex.sets[j];
      if (!s.done){
        const p=(lastFor(ex.name)||[])[j];
        if (s.w==="" && p) s.w=String(p.w); if (s.r==="" && p) s.r=String(p.r);
        if (!(+s.r>0)){ flash(`Enter ${isTime(ex.name)?"seconds":"reps"} before marking the set done.`); return; }
      }
      s.done=!s.done; break;
    }
    case "finish": {
      const ex = a.exercises.map(x=>({name:x.name, sets:x.sets.filter(s=>s.done).map(s=>({w:+s.w||0, r:+s.r}))})).filter(x=>x.sets.length);
      if (!ex.length){ flash("Mark at least one set done before finishing."); return; }
      state.history.unshift({id:a.id, name:a.name.trim()||"Workout", start:a.start, end:Date.now(), exercises:ex});
      state.active=null; flash("Workout saved."); break;
    }
    case "discard": if (!confirm("Discard this workout? Logged sets will be lost.")) return; state.active=null; break;
    case "del": if (!confirm("Delete this workout from history?")) return; state.history=state.history.filter(w=>w.id!==id); flash("Workout deleted."); break;
    case "wipe": if (!confirm("Delete your profile and all workouts from this browser?")) return; state={profile:null,history:[],active:null,custom:[]}; tab="workout"; break;
    case "export": exportBackup(); return;
    case "import": $("#importFile").value=""; $("#importFile").click(); return;
  }
  save(); render();
});

view.addEventListener("input", e=>{
  const t=e.target, f=t.dataset.f; if (!f || !state.active) return;
  if (f==="name") state.active.name=t.value;
  else state.active.exercises[+t.dataset.i].sets[+t.dataset.j][f]=t.value;
  save();
});

view.addEventListener("submit", e=>{
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)); d.name=d.name.trim();
  if (!d.name) return;
  const first = e.target.dataset.first==="1";
  state.profile = d; save(); flash(first?"Profile created.":"Profile saved."); render();
});

$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if (!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0); });

/* backup: export / import */
function exportBackup(){
  const d = new Date(), day = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const data = {app:"Setbook", version:1, exported:d.toISOString(), profile:state.profile, history:state.history, active:state.active, custom:state.custom};
  const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}));
  const a = document.createElement("a"); a.href=url; a.download=`setbook-backup-${day}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  flash("Backup exported.");
}
function validBackup(d){
  const isObj = x => x && typeof x==="object" && !Array.isArray(x);
  return isObj(d) && isObj(d.profile) && typeof d.profile.name==="string" && d.profile.name.trim() !== ""
    && Array.isArray(d.history) && d.history.every(w => isObj(w) && w.id!=null && typeof w.start==="number" && typeof w.end==="number"
      && Array.isArray(w.exercises) && w.exercises.every(e => isObj(e) && typeof e.name==="string" && Array.isArray(e.sets)));
}
$("#importFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch(err){ flash("That file isn’t a Setbook backup."); return; }
  if (!validBackup(d)){ flash("That file isn’t a Setbook backup."); return; }
  const n = d.history.length;
  if (!confirm(`Replace your profile and ${state.history.length} workout${state.history.length===1?"":"s"} with this backup (${n} workout${n===1?"":"s"})? Your current data will be lost.`)) return;
  const act = d.active;
  state = {profile:d.profile, history:d.history.map(w=>({...w, id:String(w.id)})),
           active:(act && typeof act==="object" && typeof act.start==="number" && Array.isArray(act.exercises)) ? act : null,
           custom:cleanCustom(d.custom)};
  save(); flash("Backup imported."); render();
});

/* picker */
const picker = $("#picker");
function renderList(){
  const raw = $("#q").value.trim().replace(/\s+/g," "), q = raw.toLowerCase();
  const have = new Set((state.active?.exercises||[]).map(e=>e.name));
  const btn = (n, extra="") => `<button class="pick" data-add="${esc(n)}" ${have.has(n)?"disabled":""}>${esc(n)}${have.has(n)?" <small>(added)</small>":""}</button>${extra}`;
  const mine = state.custom.filter(c=>c.name.toLowerCase().includes(q));
  let html = mine.length ? `<h3>My exercises</h3>` + mine.map(c=>`<div class="mine">${btn(c.name)}<button class="btn ghost small danger" data-rmcustom="${esc(c.name)}" aria-label="Remove ${esc(c.name)} from my exercises">Remove</button></div>`).join("") : "";
  html += MUSCLES.map(m=>{
    const items = EX.filter(x=>x[1]===m && x[0].toLowerCase().includes(q));
    return items.length ? `<h3>${m}</h3>` + items.map(([n])=>btn(n)).join("") : "";
  }).join("");
  const exists = raw && (EX.some(x=>x[0].toLowerCase()===q) || state.custom.some(c=>c.name.toLowerCase()===q));
  if (raw && !exists){
    html += `<div class="addown"><p class="note">Not in the list? Add “${esc(raw.slice(0,40))}” as your own exercise, logged in:</p>
      <div class="row backup"><button class="btn small" data-newcustom="reps">Reps</button><button class="btn small" data-newcustom="sec">Seconds</button></div></div>`;
  }
  $("#list").innerHTML = html || '<p class="note">Type a name to search, or to add your own exercise.</p>';
}
function addToWorkout(name){
  const prev=lastFor(name), n = prev ? prev.length : 3;
  state.active.exercises.push({name, sets:[...Array(n)].map(()=>({w:"",r:"",done:false}))});
}
function openPicker(){ $("#q").value=""; renderList(); picker.showModal(); }
$("#q").addEventListener("input", renderList);
$("#closePick").addEventListener("click", ()=>picker.close());
$("#list").addEventListener("click", e=>{
  const rm=e.target.closest("[data-rmcustom]");
  if (rm){ state.custom=state.custom.filter(c=>c.name!==rm.dataset.rmcustom); save(); renderList(); flash("Removed from your exercises. Past workouts keep it."); return; }
  const nc=e.target.closest("[data-newcustom]");
  if (nc){
    const name=$("#q").value.trim().replace(/\s+/g," ").slice(0,40); if (!name || !state.active) return;
    state.custom.push({name, timed:nc.dataset.newcustom==="sec"});
    addToWorkout(name); picker.close(); save(); render(); flash(`Added “${name}” to your exercises.`); return;
  }
  const b=e.target.closest("[data-add]"); if (!b || !state.active) return;
  addToWorkout(b.dataset.add);
  picker.close(); save(); render();
});
render();

/* offline support */
if ("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
