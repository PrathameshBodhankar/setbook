<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setbook · Workout log</title>
<meta name="description" content="Setbook is a free workout log. Record the weight and reps of every set, and track your records and weekly progress. No account, data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2340B8">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --border:#E2E5EB; --text:#151821; --muted:#5B6372;
  --accent:#2340B8; --accent-ink:#FFFFFF; --soft:#E9EDFB; --done:#E6F5EC; --done-ink:#17733A; --on-done:#FFFFFF;
  --danger:#B42318; --warm:#A15C07; --gold-bg:#FFF3D1; --gold:#7A5200;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1117; --card:#181B23; --border:#2A2F3A; --text:#E9ECF2; --muted:#9BA3B2;
  --accent:#8EA4FF; --accent-ink:#0F1117; --soft:#1F2744; --done:#13301F; --done-ink:#62D394; --on-done:#0F1117;
  --danger:#FF8A80; --warm:#F2B25C; --gold-bg:#3A2E10; --gold:#F7D47A; --shadow:none; color-scheme:dark;
}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
input[type=number]{-moz-appearance:textfield; appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
body.welcome .wrap{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased}
.wrap{max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0; color:var(--text); letter-spacing:-.01em}
h1{font-size:20px; line-height:1.2}
h2{font-size:20px; line-height:1.3; margin:28px 0 10px}
h3{font-size:17px; line-height:1.35}
p{margin:0 0 10px}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:4px 0 8px}
.brand{display:flex; align-items:center; gap:10px}
.brand img{width:34px; height:34px; border-radius:9px}
.tag{margin:0; font-size:13px; color:var(--muted); line-height:1.2}
#greet{font-size:14px; color:var(--muted)}
.note,.meta,.prev,figcaption,.hint{color:var(--muted)}
.note{margin:0 0 12px}
.meta{font-size:14px}
.hint{font-size:14px; line-height:1.45; margin:8px 0 0}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin:12px 0; box-shadow:var(--shadow)}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.row.end{justify-content:flex-end; margin-top:20px}
.row.backup{justify-content:flex-start; margin:8px 0 0; gap:8px}
.btn{font:inherit; font-weight:600; color:var(--accent); background:var(--soft); border:1px solid transparent; cursor:pointer;
  border-radius:10px; min-height:44px; padding:0 16px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.big{width:100%; min-height:52px; font-size:17px; margin:6px 0}
.btn.ghost{background:transparent; padding:0 10px}
.btn.small{min-height:36px; font-size:14px; padding:0 12px}
.btn.danger{color:var(--danger)} .btn.danger:not(.ghost){background:transparent; border-color:var(--danger)}
.btn:disabled{opacity:.4; cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
input,select,textarea{font:inherit; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:10px; min-height:44px; width:100%; padding:0 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none}
textarea{padding:10px 12px; min-height:80px; resize:vertical}
.form{display:grid; gap:14px}
.form label{display:grid; gap:6px; font-weight:600; font-size:15px}
.form .btn{margin-top:4px}
.opt{border-top:1px solid var(--border); padding-top:12px}
.opt summary{cursor:pointer; color:var(--accent); font-weight:600; font-size:15px}
.opt[open] summary{margin-bottom:12px}
.opt .form{gap:14px}
/* welcome */
.hero{padding:8px 0 4px}
.hero h2{font-size:26px; line-height:1.25; margin:12px 0 8px}
.hero p{color:var(--muted); font-size:17px}
.feat{list-style:none; padding:0; margin:16px 0 0; display:grid; gap:10px}
.feat li{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px}
.feat .ic{flex:none; width:32px; height:32px; border-radius:8px; background:var(--soft); color:var(--accent); display:grid; place-items:center}
.feat b{display:block}
.feat span{color:var(--muted); font-size:15px}
.steps{margin:6px 0 0; padding-left:22px; display:grid; gap:6px}
.steps li::marker{color:var(--accent); font-weight:700}
/* workout */
.title{font-size:20px; font-weight:700; border-color:transparent; background:transparent; padding:0 4px; margin:0 -4px}
.title:focus{background:var(--card)}
.datein{max-width:180px; margin-left:8px; min-height:38px}
.ex{padding:14px 12px}
.exhead{display:flex; align-items:center; justify-content:space-between; gap:4px 8px; flex-wrap:wrap; margin-bottom:6px}
.exname,.linkish{font:inherit; color:var(--text); background:none; border:0; padding:0; cursor:pointer; text-align:left}
.exname{font-size:17px; font-weight:700}
.exname::after{content:" ›"; color:var(--muted); font-weight:400}
.linkish{color:var(--accent); font-weight:600}
.ctl{display:flex; gap:2px; flex-wrap:wrap}
.ctl .btn{padding:0 8px; color:var(--muted)}
.ctl .btn.danger{color:var(--danger)}
.sets{margin:4px 0 6px}
.sh,.set{display:grid; grid-template-columns:34px 1fr 76px 64px 44px; gap:8px; align-items:center}
.sh{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:0 6px 4px}
.set{min-height:52px; border-radius:10px; padding:0 6px}
.set + .set{margin-top:4px}
.set input{text-align:center; font-variant-numeric:tabular-nums; padding:0 4px; min-height:42px}
.set.done{background:var(--done)}
.set.done input{background:transparent; border-color:transparent; font-weight:600}
.prev{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
.setno{font:inherit; font-weight:700; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; padding:0; cursor:pointer}
.set.warm .setno{color:var(--warm); border-color:var(--warm)}
.set.warm input{color:var(--muted)}
.chk{width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:18px; font-weight:700; cursor:pointer}
.chk[aria-pressed="true"]{background:var(--done-ink); border-color:var(--done-ink); color:var(--on-done)}
.unit{font:inherit; font-size:12px; font-weight:700; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; text-align:left; text-transform:uppercase; letter-spacing:.04em}
.exnote{font-size:15px; margin-top:8px; min-height:40px}
.addex{width:100%; min-height:52px; border:1.5px dashed var(--accent); background:transparent; margin:12px 0}
/* lists */
.entry{padding:0; overflow:hidden}
.entry summary{cursor:pointer; padding:14px 16px; display:flex; flex-wrap:wrap; gap:2px 10px; align-items:center; list-style:none}
.entry summary::-webkit-details-marker{display:none}
.entry summary::after{content:"›"; margin-left:auto; color:var(--muted); font-size:20px; transition:transform .15s}
.entry[open] summary::after{transform:rotate(90deg)}
.entry .body{padding:0 16px 14px; border-top:1px solid var(--border)}
.lines{list-style:none; padding:0; margin:10px 0}
.lines li{padding:6px 0; border-bottom:1px solid var(--border)}
.lines li:last-child{border-bottom:0}
.warmtxt{color:var(--warm)}
.wnote{color:var(--muted); font-style:italic; margin:4px 0; font-size:15px}
.badge{display:inline-block; background:var(--gold-bg); color:var(--gold); font-size:12px; font-weight:700; border-radius:999px; padding:0 8px; line-height:22px; white-space:nowrap}
.badge.blue{background:var(--soft); color:var(--accent)}
.routine{display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--border)}
.routine:last-child{border-bottom:0}
.routine .pick{flex:1; border:0}
.list{padding:4px 16px}
/* progress */
.seg{display:flex; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px; margin:4px 0 12px}
.seg .btn{flex:1; min-height:38px; font-size:14px; padding:0 6px; background:transparent; color:var(--muted)}
.seg .btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px}
.stats div,.top3 div{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:var(--shadow)}
.stats b,.top3 b{display:block; font-size:22px; line-height:1.2; font-variant-numeric:tabular-nums}
.stats span,.top3 span{font-size:13px; color:var(--muted)}
.top3{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:8px 0 12px}
.chart{margin:0}
.chart svg{width:100%; height:auto; display:block}
.bar{fill:var(--accent); opacity:.35} .bar.now{opacity:1}
.lbl{font-size:10px; fill:var(--muted)} .cnt{font-size:11px; font-weight:700; fill:var(--text)}
figcaption{font-size:13px; line-height:1.45; margin-top:8px}
/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:var(--card); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
.tabs button{flex:1; max-width:160px; font:inherit; font-size:12px; font-weight:600; color:var(--muted); background:none; border:0; min-height:60px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
.tabs svg{width:22px; height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
/* dialogs */
dialog{width:min(560px, calc(100vw - 24px)); max-height:84vh; padding:16px; color:var(--text); background:var(--card); border:0; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,30,.5)}
.ph{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.ph h2{margin:0}
#q{margin:0 0 6px}
#list h3{margin:16px 0 4px; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.pick{display:block; width:100%; text-align:left; font:inherit; color:var(--text); background:none; border:0; border-bottom:1px solid var(--border); min-height:46px; cursor:pointer; padding:0 4px}
.pick small{color:var(--muted)}
.pick:hover:not(:disabled){color:var(--accent)}
.pick:disabled{color:var(--muted); cursor:default}
.mine{display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--border)} .mine .pick{flex:1; border:0}
.addfirst{margin:4px 0 8px}
.addfirst .btn{width:100%; justify-content:flex-start}
#toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-weight:600; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:min(90vw,480px); text-align:center; z-index:10}
#toast.show{opacity:1}
@media (max-width:420px){
  .sh,.set{grid-template-columns:32px 1fr 64px 54px 42px; gap:6px}
  .stats b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){#toast,.entry summary::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand"><img src="icon-192.png" alt=""><div><h1>Setbook</h1><p class="tag">Workout log</p></div></div><span id="greet"></span></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Log</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Progress</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
</nav>
<dialog id="picker" aria-labelledby="pickTitle">
  <div class="ph"><h2 id="pickTitle">Add exercise</h2><button class="btn ghost small" id="closePick">Close</button></div>
  <input id="q" type="search" placeholder="Search, or type a new exercise" aria-label="Search or add an exercise" enterkeyhint="go" autocomplete="off">
  <div id="list"></div>
</dialog>
<dialog id="exdlg" aria-labelledby="exTitle">
  <div class="ph"><h2 id="exTitle"></h2><button class="btn ghost small" id="closeEx">Close</button></div>
  <div id="exBody"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const EX = [
  ["Bench Press","Chest"],["Incline Bench Press","Chest"],["Incline Dumbbell Press","Chest"],["Dumbbell Bench Press","Chest"],
  ["Chest Fly","Chest"],["Cable Crossover","Chest"],["Push-up","Chest"],
  ["Overhead Press","Shoulders"],["Dumbbell Shoulder Press","Shoulders"],["Arnold Press","Shoulders"],["Lateral Raise","Shoulders"],
  ["Front Raise","Shoulders"],["Rear Delt Fly","Shoulders"],["Face Pull","Shoulders"],["Shrug","Shoulders"],
  ["Pull-up","Back"],["Chin-up","Back"],["Lat Pulldown","Back"],["Barbell Row","Back"],["Seated Cable Row","Back"],
  ["Dumbbell Row","Back"],["T-Bar Row","Back"],["Deadlift","Back"],["Back Extension","Back"],
  ["Back Squat","Legs"],["Front Squat","Legs"],["Goblet Squat","Legs"],["Leg Press","Legs"],["Hack Squat","Legs"],
  ["Romanian Deadlift","Legs"],["Lunge","Legs"],["Walking Lunge","Legs"],["Bulgarian Split Squat","Legs"],["Step-up","Legs"],
  ["Leg Curl","Legs"],["Leg Extension","Legs"],["Calf Raise","Legs"],["Hip Thrust","Legs"],["Glute Bridge","Legs"],
  ["Bicep Curl","Arms"],["Hammer Curl","Arms"],["Preacher Curl","Arms"],["Tricep Pushdown","Arms"],["Overhead Tricep Extension","Arms"],
  ["Skull Crusher","Arms"],["Close-Grip Bench Press","Arms"],["Dip","Arms"],
  ["Plank","Core"],["Side Plank","Core"],["Crunch","Core"],["Hanging Leg Raise","Core"],["Russian Twist","Core"],
  ["Cable Crunch","Core"],["Ab Wheel Rollout","Core"],["Mountain Climber","Core"],["Dead Bug","Core"],
  ["The Hundred","Pilates"],["Roll Up","Pilates"],["Single Leg Circles","Pilates"],["Rolling Like a Ball","Pilates"],
  ["Single Leg Stretch","Pilates"],["Double Leg Stretch","Pilates"],["Criss-Cross","Pilates"],["Spine Stretch Forward","Pilates"],
  ["Saw","Pilates"],["Swan","Pilates"],["Swimming","Pilates"],["Teaser","Pilates"],["Side Kick Series","Pilates"],
  ["Shoulder Bridge","Pilates"],["Leg Pull Front","Pilates"],["Pilates Plank","Pilates"]
];
const MUSCLES = ["Chest","Shoulders","Back","Legs","Arms","Core","Pilates"];
const TIMED = new Set(["Plank","Side Plank","Swimming","Leg Pull Front","Pilates Plank"]);
const REPO = "https://github.com/PrathameshBodhankar/setbook";
const TIMED_WORDS = /\b(plank|hold|hang|wall sit|isometric|static)\b/i;
const customOf = n => state.custom.find(c=>c.name===n);
const isTime = n => TIMED.has(n) || !!(customOf(n)||{}).timed;
const RANGES = [1,4,8,12];

/* ---------- storage: localStorage with in-memory fallback ---------- */
const KEY = "setbook:v1";
let memCopy = null;
const isObj = x => !!x && typeof x==="object" && !Array.isArray(x);
function cleanCustom(list){
  if (!Array.isArray(list)) return [];
  const seen = new Set();
  return list.filter(c => isObj(c) && typeof c.name==="string" && c.name.trim() && !seen.has(c.name.trim().toLowerCase()) && seen.add(c.name.trim().toLowerCase()))
             .map(c => ({name:c.name.trim().replace(/\s+/g," ").slice(0,40), timed:!!c.timed}));
}
function cleanRoutines(list){
  if (!Array.isArray(list)) return [];
  return list.filter(r => isObj(r) && typeof r.name==="string" && Array.isArray(r.exercises))
    .map(r => ({id:String(r.id ?? Date.now().toString(36)+Math.random().toString(36).slice(2,6)), name:r.name.slice(0,60) || "Routine",
      exercises:r.exercises.filter(e=>isObj(e) && typeof e.name==="string").map(e=>({name:e.name, sets:Math.max(1, Math.min(20, +e.sets||3)), warm:Math.max(0, Math.min(10, +e.warm||0))}))}));
}
function normalize(d){
  d = isObj(d) ? d : {};
  d.profile = isObj(d.profile) ? d.profile : null;
  if (d.profile && d.profile.unit!=="lb") d.profile.unit = "kg";
  d.history = Array.isArray(d.history) ? d.history : [];
  d.history.sort((a,b)=>b.start-a.start);
  d.active = isObj(d.active) && typeof d.active.start==="number" && Array.isArray(d.active.exercises) ? d.active : null;
  d.custom = cleanCustom(d.custom);
  d.routines = cleanRoutines(d.routines);
  d.ui = isObj(d.ui) ? d.ui : {};
  if (!RANGES.includes(d.ui.range)) d.ui.range = 8;
  return d;
}
function load(){
  let d = null;
  try { const s = localStorage.getItem(KEY); if (s) d = JSON.parse(s); } catch(e){}
  return normalize(d || memCopy);
}
function save(){
  memCopy = state;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

let state = load();
let tab = "workout";
const $ = s => document.querySelector(s);
const view = $("#view");

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const shortDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const ymd = t => { const d = new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* units: weights are stored in kg; shown and typed in the profile's unit */
const LB = 2.20462;
const unit = () => (state.profile && state.profile.unit) || "kg";
const toU = kg => { const v = unit()==="lb" ? kg*LB : kg; return Math.round(v*10)/10; };
const fromU = v => unit()==="lb" ? v/LB : v;
const fmtW = kg => toU(kg).toLocaleString();
const fmtVol = kg => Math.round(toU(kg)).toLocaleString()+" "+unit();
const working = sets => sets.filter(s=>!s.warm);
const exVol = e => isTime(e.name) ? 0 : working(e.sets).reduce((b,s)=>b+((s.done!==false)?(+s.w||0)*(+s.r||0):0),0);
const vol = w => w.exercises.reduce((a,e)=>a+exVol(e),0);
const setTxt = (s, name) => (s.w ? fmtW(s.w)+"×" : "") + s.r + (isTime(name) ? "s" : "");
function lastFor(name, beforeId){
  for (const w of state.history){ if (w.id===beforeId) continue; const e = w.exercises.find(x=>x.name===name); if (e && e.sets.length) return e.sets; }
  return null;
}
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function periodStats(from, to){
  const ws = state.history.filter(w=>w.start>=from && w.start<to);
  return {from, count:ws.length, vol:ws.reduce((a,w)=>a+vol(w),0),
          sets:ws.reduce((a,w)=>a+w.exercises.reduce((b,x)=>b+working(x.sets).length,0),0), list:ws};
}
const weekStats = back => { const s = weekStart(Date.now()); s.setDate(s.getDate()-7*back); const e = new Date(s); e.setDate(e.getDate()+7); return periodStats(s.getTime(), e.getTime()); };
const e1rm = s => (s.w>0 && s.r>0 && s.r<=12) ? s.w*(1+s.r/30) : 0;
let toastTimer;
function flash(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }

/* ---------- records ---------- */
function bestsBefore(name, start){
  const b = {heavy:0, e1:0, reps:0, hold:0, seen:false};
  for (const w of state.history){
    if (w.start >= start) continue;
    const e = w.exercises.find(x=>x.name===name); if (!e) continue;
    for (const s of working(e.sets)){
      b.seen = true;
      if (isTime(name)) b.hold = Math.max(b.hold, +s.r||0);
      else { b.heavy = Math.max(b.heavy, +s.w||0); b.e1 = Math.max(b.e1, e1rm(s)); if (!(+s.w)) b.reps = Math.max(b.reps, +s.r||0); }
    }
  }
  return b;
}
function prsOf(w){
  const out = [];
  for (const e of w.exercises){
    const b = bestsBefore(e.name, w.start); if (!b.seen) continue;
    const ws = working(e.sets); if (!ws.length) continue;
    if (isTime(e.name)){ const m = Math.max(...ws.map(s=>+s.r||0)); if (m > b.hold) out.push(`${e.name}: longest hold ${m}s`); continue; }
    const heavy = Math.max(...ws.map(s=>+s.w||0)), e1 = Math.max(...ws.map(e1rm)), reps = Math.max(0, ...ws.filter(s=>!(+s.w)).map(s=>+s.r||0));
    if (heavy > 0 && heavy > b.heavy) out.push(`${e.name}: heaviest ${fmtW(heavy)} ${unit()}`);
    else if (e1 > 0 && e1 > b.e1 + 0.01) out.push(`${e.name}: est. 1RM ${fmtW(e1)} ${unit()}`);
    else if (reps > 0 && reps > b.reps && !heavy) out.push(`${e.name}: most reps ${reps}`);
  }
  return out;
}
function exStats(name){
  const sessions = state.history.filter(w=>w.exercises.some(e=>e.name===name))
    .map(w=>({w, e:w.exercises.find(e=>e.name===name)}));
  const st = {sessions, heavy:null, e1:0, reps:0, hold:0, vol:0};
  for (const {e} of sessions){
    for (const s of working(e.sets)){
      if (isTime(name)) st.hold = Math.max(st.hold, +s.r||0);
      else {
        if (+s.w>0 && (!st.heavy || +s.w>st.heavy.w || (+s.w===st.heavy.w && +s.r>st.heavy.r))) st.heavy = {w:+s.w, r:+s.r};
        st.e1 = Math.max(st.e1, e1rm(s));
        if (!(+s.w)) st.reps = Math.max(st.reps, +s.r||0);
      }
    }
    st.vol = Math.max(st.vol, exVol(e));
  }
  return st;
}

function progressView(){
  const n = state.ui.range, now = Date.now();
  const startCur = weekStart(now); startCur.setDate(startCur.getDate()-7*(n-1));
  const endCur = weekStart(now); endCur.setDate(endCur.getDate()+7);
  const startPrev = new Date(startCur); startPrev.setDate(startPrev.getDate()-7*n);
  const cur = periodStats(startCur.getTime(), endCur.getTime()), prev = periodStats(startPrev.getTime(), startCur.getTime());
  const diff = prev.vol ? Math.round((cur.vol-prev.vol)/prev.vol*100) : null;
  const label = n===1 ? "This week" : `Last ${n} weeks`;
  // bars: days for one week, weeks otherwise
  let buckets;
  if (n===1){
    buckets = [...Array(7)].map((_,i)=>{ const d = new Date(startCur); d.setDate(d.getDate()+i); const e = new Date(d); e.setDate(e.getDate()+1);
      return {...periodStats(d.getTime(), e.getTime()), lbl:d.toLocaleDateString(undefined,{weekday:"short"}), tip:fmtDate(d)}; });
  } else {
    buckets = [...Array(n)].map((_,i)=>{ const d = new Date(startCur); d.setDate(d.getDate()+7*i); const e = new Date(d); e.setDate(e.getDate()+7);
      return {...periodStats(d.getTime(), e.getTime()), lbl:shortDate(d), tip:"Week of "+shortDate(d)}; });
  }
  const max = Math.max(1, ...buckets.map(b=>b.vol));
  const W=320, H=180, k=buckets.length, slot=W/k, bw=Math.min(28, slot*0.6), every = k>8 ? 2 : 1;
  const bars = buckets.map((b,i)=>{
    const h = Math.round(b.vol/max*(H-54)), x = i*slot+(slot-bw)/2, y = H-24-h;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${b.vol?Math.max(h,2):0}" rx="3" class="bar${i===k-1?" now":""}">
      <title>${b.tip}: ${fmtVol(b.vol)}, ${plural(b.count,"workout")}</title></rect>
      ${(i%every===0 || i===k-1)?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="lbl">${b.lbl}</text>`:""}
      ${b.count?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="cnt">${b.count}</text>`:""}</g>`;
  }).join("");
  // exercises done in this period
  const tally = {};
  for (const w of cur.list) for (const e of w.exercises){ (tally[e.name] = tally[e.name] || {n:0, sets:0}); tally[e.name].n++; tally[e.name].sets += working(e.sets).length; }
  const exRows = Object.entries(tally).sort((a,b)=>b[1].n-a[1].n || b[1].sets-a[1].sets).map(([name,t])=>{
    const st = exStats(name);
    const best = isTime(name) ? (st.hold?`best ${st.hold}s`:"") : st.heavy ? `best ${fmtW(st.heavy.w)} ${unit()} × ${st.heavy.r}` : (st.reps?`best ${st.reps} reps`:"");
    return `<button class="pick" data-act="exinfo" data-name="${esc(name)}">${esc(name)} <small>· ${plural(t.n,"session")}, ${plural(t.sets,"set")}${best?" · "+best:""}</small></button>`;
  }).join("");
  if (!state.history.length) return `<h2>Progress</h2><div class="card"><p>Nothing to show yet.</p><p class="note">Once you’ve finished a workout, this page shows how many workouts you’ve done, the total weight you’ve lifted and your best sets, over the last 1 to 12 weeks.</p><button class="btn primary" data-act="gotolog">Start a workout</button></div>`;
  return `<h2>Progress</h2>
  <div class="seg" role="group" aria-label="Time range">${RANGES.map(r=>`<button class="btn" data-act="range" data-n="${r}" aria-pressed="${r===n}">${r===1?"1 week":r+" weeks"}</button>`).join("")}</div>
  <h3>${label}</h3>
  <div class="stats"><div><b>${cur.count}</b><span>${cur.count===1?"workout":"workouts"}</span></div><div><b>${fmtVol(cur.vol)}</b><span>volume</span></div><div><b>${cur.sets}</b><span>working sets</span></div></div>
  <p class="note">${n>1?`About ${Math.round(cur.count/n*10)/10} workouts a week. `:""}${diff===null?`Not enough earlier data to compare with the ${n===1?"previous week":"previous "+n+" weeks"} yet.`:`Volume ${diff>=0?"up":"down"} ${Math.abs(diff)}% on the ${n===1?"previous week":"previous "+n+" weeks"}.`}</p>
  <figure class="chart card"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Training volume, ${label.toLowerCase()}">${bars}</svg>
  <figcaption>Bars show total ${unit()} lifted (weight × reps, warm-ups excluded) ${n===1?"each day this week":"each week, starting Monday"}. The number above a bar is how many workouts you did.</figcaption></figure>
  <h2>Exercises</h2>
  ${exRows ? `<div class="card list">${exRows}</div><p class="hint">Tap an exercise for its full history and personal records.</p>` : `<p class="note">No exercises logged in this period.</p>`}`;
}

/* ---------- workouts ---------- */
const blankSets = (n, warm=0) => [...Array(n)].map((_,j)=>({w:"", r:"", done:false, warm:j<warm}));
function startWith(name, exercises){
  state.active = {id:newId(), name, start:Date.now(), date:ymd(Date.now()), note:"", exercises};
  tab = "workout";
}
function fromWorkout(w){ // exercises shaped for a new workout, same exercises and set counts
  return w.exercises.map(e=>({name:e.name, note:"", sets:e.sets.map(s=>({w:"", r:"", done:false, warm:!!s.warm}))}));
}
function finishActive(){
  const a = state.active;
  const ex = a.exercises.map(x=>{
    const o = {name:x.name, sets:x.sets.filter(s=>s.done).map(s=>{ const r={w:Math.round((+s.w||0)*1000)/1000, r:+s.r}; if (s.warm) r.warm=true; return r; })};
    if (x.note && x.note.trim()) o.note = x.note.trim();
    return o;
  }).filter(x=>x.sets.length);
  if (!ex.length){ flash("Mark at least one set done before saving."); return false; }
  const date = a.date || ymd(a.start);
  let start = a.start;
  if (date !== ymd(a.start)){ const [y,m,d] = date.split("-").map(Number); start = new Date(y, m-1, d, 12).getTime(); }
  const w = {id:a.editingId || a.id, name:(a.name||"").trim()||"Workout", start, end:Math.max(start, a.end || Date.now()), exercises:ex};
  if (a.note && a.note.trim()) w.note = a.note.trim();
  state.history = state.history.filter(h=>h.id!==w.id);
  state.history.push(w); state.history.sort((x,y)=>y.start-x.start);
  state.active = null;
  const prs = prsOf(w);
  flash(a.editingId ? "Changes saved." : prs.length ? `Workout saved. New PR — ${prs[0]}${prs.length>1?` (+${prs.length-1} more)`:""}` : "Workout saved.");
  return true;
}

/* ---------- events ---------- */
view.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const {act, id} = b.dataset, i = +b.dataset.i, j = +b.dataset.j, a = state.active;
  switch (act){
    case "start": startWith(new Date().toLocaleDateString(undefined,{weekday:"long"})+" workout", []); break;
    case "repeat": { const l = state.history[0]; if (!l) return; startWith(l.name, fromWorkout(l)); break; }
    case "startroutine": { const r = state.routines.find(x=>x.id===id); if (!r) return; startWith(r.name, r.exercises.map(x=>({name:x.name, note:"", sets:blankSets(x.sets, x.warm)}))); break; }
    case "saveroutine": {
      const w = state.history.find(x=>x.id===id); if (!w) return;
      let name = w.name, k = 2; while (state.routines.some(r=>r.name===name)) name = `${w.name} (${k++})`;
      state.routines.push({id:newId(), name, exercises:w.exercises.map(x=>({name:x.name, sets:x.sets.length, warm:x.sets.filter(s=>s.warm).length}))});
      flash(`Saved routine “${name}”. Find it under Workout.`); break;
    }
    case "renroutine": { const r = state.routines.find(x=>x.id===id); if (!r) return; const nn = prompt("Routine name", r.name); if (nn===null || !nn.trim()) return; r.name = nn.trim().slice(0,60); break; }
    case "delroutine": { const r = state.routines.find(x=>x.id===id); if (!r || !confirm(`Delete the routine “${r.name}”? Past workouts aren’t affected.`)) return; state.routines = state.routines.filter(x=>x.id!==id); break; }
    case "edit": {
      if (a){ flash(a.editingId ? "Finish editing the other workout first." : "Finish or discard your current workout first."); return; }
      const w = state.history.find(x=>x.id===id); if (!w) return;
      state.active = {id:w.id, editingId:w.id, name:w.name, start:w.start, end:w.end, date:ymd(w.start), note:w.note||"",
        exercises:w.exercises.map(x=>({name:x.name, note:x.note||"", sets:x.sets.map(s=>({w:s.w||"", r:String(s.r), done:true, warm:!!s.warm}))}))};
      tab = "workout"; window.scrollTo(0,0); break;
    }
    case "canceledit": state.active = null; tab = "history"; break;
    case "exinfo": exInfo(b.dataset.name); return;
    case "gotolog": tab = "workout"; break;
    case "range": state.ui.range = +b.dataset.n; break;
    case "pick": openPicker(); return;
    case "rmex": a.exercises.splice(i,1); break;
    case "up": if (i>0) [a.exercises[i-1], a.exercises[i]] = [a.exercises[i], a.exercises[i-1]]; break;
    case "down": if (i<a.exercises.length-1) [a.exercises[i+1], a.exercises[i]] = [a.exercises[i], a.exercises[i+1]]; break;
    case "unit": { const c = customOf(a.exercises[i].name); if (c){ c.timed = !c.timed; flash(`${c.name} now logs ${c.timed?"seconds":"reps"}.`); } break; }
    case "warm": a.exercises[i].sets[j].warm = !a.exercises[i].sets[j].warm; break;
    case "addset": { const ex=a.exercises[i], l=ex.sets[ex.sets.length-1]; ex.sets.push({w:l?l.w:"", r:l?l.r:"", done:false, warm:false}); break; }
    case "done": {
      const ex=a.exercises[i], s=ex.sets[j];
      if (!s.done){
        const p=(lastFor(ex.name, a.editingId)||[])[j];
        if (s.w==="" && p) s.w=p.w; if (s.r==="" && p) s.r=String(p.r);
        if (!(+s.r>0)){ flash(`Enter ${isTime(ex.name)?"seconds":"reps"} before marking the set done.`); return; }
      }
      s.done=!s.done; break;
    }
    case "finish": { const was = a.editingId; if (!finishActive()) return; if (was) tab = "history"; break; }
    case "discard": if (!confirm("Discard this workout? Logged sets will be lost.")) return; state.active=null; break;
    case "del": if (!confirm("Delete this workout from history?")) return; state.history=state.history.filter(w=>w.id!==id); flash("Workout deleted."); break;
    case "wipe": if (!confirm("Delete your profile, workouts, routines and custom exercises from this browser?")) return; state=normalize(null); tab="workout"; break;
    case "export": exportBackup(); return;
    case "import": $("#importFile").value=""; $("#importFile").click(); return;
    default: return;
  }
  save(); render();
});

view.addEventListener("input", e=>{
  const t=e.target, f=t.dataset.f;
  if (t.id==="unitSel"){ // convert the bodyweight box when units change
    const bw=$("#bwIn"), v=parseFloat(bw.value), was=$("#bwU").textContent;
    if (!isNaN(v) && was!==t.value) bw.value = Math.round((t.value==="lb" ? v*LB : v/LB)*10)/10;
    $("#bwU").textContent = t.value; return;
  }
  if (!f || !state.active) return;
  const a = state.active;
  if (f==="name") a.name=t.value;
  else if (f==="note") a.note=t.value;
  else if (f==="date"){ if (t.value) a.date=t.value; }
  else if (f==="exnote") a.exercises[+t.dataset.i].note=t.value;
  else if (f==="w"){ a.exercises[+t.dataset.i].sets[+t.dataset.j].w = t.value==="" ? "" : fromU(+t.value); }
  else a.exercises[+t.dataset.i].sets[+t.dataset.j][f]=t.value;
  save();
});

view.addEventListener("submit", e=>{
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)); d.name=(d.name||"").trim();
  if (!d.name) return;
  d.unit = d.unit==="lb" ? "lb" : "kg";
  d.weight = d.weight==="" ? "" : Math.round((d.unit==="lb" ? +d.weight/LB : +d.weight)*100)/100;
  const first = e.target.dataset.first==="1";
  state.profile = d; save(); flash(first?"Profile created.":"Profile saved."); render();
});

$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if (!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0); });
$("#closeEx").addEventListener("click", ()=>$("#exdlg").close());

/* backup: export / import */
function exportBackup(){
  const d = new Date();
  const data = {app:"Setbook", version:2, exported:d.toISOString(), profile:state.profile, history:state.history, active:state.active,
                custom:state.custom, routines:state.routines, ui:state.ui};
  const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}));
  const a = document.createElement("a"); a.href=url; a.download=`setbook-backup-${ymd(d)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  flash("Backup exported.");
}
function validBackup(d){
  return isObj(d) && isObj(d.profile) && typeof d.profile.name==="string" && d.profile.name.trim() !== ""
    && Array.isArray(d.history) && d.history.every(w => isObj(w) && w.id!=null && typeof w.start==="number" && typeof w.end==="number"
      && Array.isArray(w.exercises) && w.exercises.every(e => isObj(e) && typeof e.name==="string" && Array.isArray(e.sets)));
}
$("#importFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch(err){ flash("That file isn’t a Setbook backup."); return; }
  if (!validBackup(d)){ flash("That file isn’t a Setbook backup."); return; }
  const n = d.history.length;
  if (!confirm(`Replace your profile and ${plural(state.history.length,"workout")} with this backup (${plural(n,"workout")})? Your current data will be lost.`)) return;
  state = normalize({profile:d.profile, history:d.history.map(w=>({...w, id:String(w.id)})), active:d.active, custom:d.custom, routines:d.routines, ui:d.ui});
  save(); flash("Backup imported."); render();
});

/* picker */
const picker = $("#picker");
const cleanName = s => s.trim().replace(/\s+/g," ").slice(0,40);
function matches(){
  const raw = cleanName($("#q").value), q = raw.toLowerCase();
  const mine = state.custom.filter(c=>c.name.toLowerCase().includes(q)).map(c=>c.name);
  const builtin = EX.filter(x=>x[0].toLowerCase().includes(q));
  const exact = [...state.custom.map(c=>c.name), ...EX.map(x=>x[0])].find(n=>n.toLowerCase()===q);
  return {raw, q, mine, builtin, exact};
}
function suggestUrl(name){
  const body = `Please add this exercise to Setbook's built-in list.\n\nExercise: ${name}\nLogged in: ${isTime(name)?"seconds":"reps"}\nMuscle group or section: `;
  return `${REPO}/issues/new?title=${encodeURIComponent("Exercise suggestion: "+name)}&body=${encodeURIComponent(body)}`;
}
function renderList(){
  const {raw, q, mine, builtin, exact} = matches();
  const have = new Set((state.active?.exercises||[]).map(e=>e.name));
  const btn = n => `<button class="pick" data-add="${esc(n)}" ${have.has(n)?"disabled":""}>${esc(n)}${have.has(n)?" <small>(added)</small>":""}</button>`;
  let html = "";
  if (raw && !exact){
    const timed = TIMED_WORDS.test(raw), none = !mine.length && !builtin.length;
    html += `<div class="addfirst"><button class="btn primary" data-newcustom="1">+ Add “${esc(raw)}”</button>
      <p class="hint">Saved to your exercises, logged in ${timed?"seconds":"reps"}. You can switch to ${timed?"reps":"seconds"} on the exercise card.${none?" Press Enter to add.":""}</p></div>`;
  }
  if (mine.length) html += `<h3>My exercises</h3>` + mine.map(n=>`<div class="mine">${btn(n)}<a class="btn ghost small" href="${esc(suggestUrl(n))}" target="_blank" rel="noopener" aria-label="Suggest ${esc(n)} for everyone (opens GitHub)">Suggest</a><button class="btn ghost small danger" data-rmcustom="${esc(n)}" aria-label="Remove ${esc(n)} from my exercises">Remove</button></div>`).join("")
    + '<p class="hint">Suggest sends an exercise to the Setbook project on GitHub (account needed) so it can be added for everyone.</p>';
  html += MUSCLES.map(m=>{ const items = builtin.filter(x=>x[1]===m); return items.length ? `<h3>${m}</h3>` + items.map(([n])=>btn(n)).join("") : ""; }).join("");
  $("#list").innerHTML = html || '<p class="note">Type a name to search, or to add your own exercise.</p>';
}
function addToWorkout(name){
  const prev=lastFor(name, state.active.editingId), n = prev ? prev.length : 3;
  state.active.exercises.push({name, note:"", sets:prev ? prev.map(s=>({w:"",r:"",done:false,warm:!!s.warm})) : blankSets(n)});
}
function addCustom(){
  const name = cleanName($("#q").value); if (!name || !state.active) return;
  if (!customOf(name)) state.custom.push({name, timed:TIMED_WORDS.test(name)});
  addToWorkout(name); picker.close(); save(); render(); flash(`Added “${name}” to your exercises.`);
}
function addPicked(name){
  if (!state.active || state.active.exercises.some(e=>e.name===name)) return;
  addToWorkout(name); picker.close(); save(); render();
}
function openPicker(){ $("#q").value=""; renderList(); picker.showModal(); $("#q").focus(); }
$("#q").addEventListener("input", renderList);
$("#q").addEventListener("keydown", e=>{
  if (e.key!=="Enter") return;
  e.preventDefault();
  const {raw, mine, builtin, exact} = matches(); if (!raw) return;
  const all = [...mine, ...builtin.map(x=>x[0])];
  if (exact) addPicked(exact);
  else if (all.length===1) addPicked(all[0]);
  else if (!all.length) addCustom();
  else flash("Several exercises match. Tap one, or tap + Add to create your own.");
});
$("#closePick").addEventListener("click", ()=>picker.close());
$("#list").addEventListener("click", e=>{
  const rm=e.target.closest("[data-rmcustom]");
  if (rm){ state.custom=state.custom.filter(c=>c.name!==rm.dataset.rmcustom); save(); renderList(); flash("Removed from your exercises. Past workouts keep it."); return; }
  if (e.target.closest("[data-newcustom]")){ addCustom(); return; }
  const b=e.target.closest("[data-add]"); if (b) addPicked(b.dataset.add);
});
render();

/* offline support */
if ("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
